name: Sync Christian main

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: sync-christian-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'owenk-bonhoga/gwero-campaign-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHRISTIAN_REPOSITORY: christianbaluti/gwero-campaign-hub
      SYNC_BRANCH: sync/christian-main
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out Owen main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch Christian main
        shell: bash
        run: |
          set -euo pipefail
          git remote add christian "https://github.com/${CHRISTIAN_REPOSITORY}.git"
          git fetch --no-tags christian main

      - name: Detect new Christian commits
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          ahead_by="$(git rev-list --count origin/main..christian/main)"
          echo "ahead_by=${ahead_by}" >> "${GITHUB_OUTPUT}"

          if [[ "${ahead_by}" == "0" ]]; then
            echo "Christian main has no commits missing from Owen main."
          else
            echo "Christian main has ${ahead_by} commit(s) to synchronize."
          fi

      - name: Prepare an up-to-date synchronization branch
        id: prepare
        if: steps.compare.outputs.ahead_by != '0'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch_exists=false
          if git fetch --no-tags origin "${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}"; then
            branch_exists=true
          fi

          branch_is_current=false
          if [[ "${branch_exists}" == "true" ]] && \
             git merge-base --is-ancestor origin/main "origin/${SYNC_BRANCH}" && \
             git merge-base --is-ancestor christian/main "origin/${SYNC_BRANCH}"; then
            branch_is_current=true
          fi

          if [[ "${branch_is_current}" == "true" ]]; then
            head_sha="$(git rev-parse "origin/${SYNC_BRANCH}")"
            updated=false
            echo "The existing synchronization branch already contains both main branches."
          else
            git switch --create "${SYNC_BRANCH}" origin/main
            git merge --no-ff --no-edit christian/main
            git push origin "HEAD:refs/heads/${SYNC_BRANCH}"
            head_sha="$(git rev-parse HEAD)"
            updated=true
          fi

          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
          echo "updated=${updated}" >> "${GITHUB_OUTPUT}"

      - name: Open a pull request when needed
        if: steps.compare.outputs.ahead_by != '0'
        shell: bash
        run: |
          set -euo pipefail

          existing_pr="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${SYNC_BRANCH}" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "${existing_pr}" ]]; then
            echo "Updated existing pull request #${existing_pr}."
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${SYNC_BRANCH}" \
              --title "Sync Christian main into Owen main" \
              --body "Automated synchronization from christianbaluti/gwero-campaign-hub main. Required checks must pass before Owen's protected main branch is updated."
          fi

      - name: Verify and merge the exact synchronization commit
        if: steps.compare.outputs.ahead_by != '0'
        env:
          HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          find_run() {
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${SYNC_BRANCH}&event=workflow_dispatch&per_page=20" \
              --jq "[.workflow_runs[] | select(.head_sha == \"${HEAD_SHA}\")] | sort_by(.created_at) | reverse | .[0] // empty"
          }

          run_json="$(find_run)"
          if [[ -z "${run_json}" ]]; then
            gh workflow run ci.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${SYNC_BRANCH}"

            for _ in {1..60}; do
              run_json="$(find_run)"
              [[ -n "${run_json}" ]] && break
              sleep 5
            done
          fi

          [[ -n "${run_json}" ]] || {
            echo "The verification workflow did not start." >&2
            exit 1
          }

          run_id="$(jq -r '.id' <<<"${run_json}")"
          run_url="$(jq -r '.html_url' <<<"${run_json}")"

          for _ in {1..240}; do
            run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(jq -r '.status' <<<"${run_json}")"
            [[ "${status}" == "completed" ]] && break
            sleep 5
          done

          conclusion="$(jq -r '.conclusion // empty' <<<"${run_json}")"
          [[ "${status}" == "completed" && "${conclusion}" == "success" ]] || {
            echo "Verification did not complete successfully: ${run_url}" >&2
            exit 1
          }

          # A workflow_dispatch check is not associated with the pull request in
          # GitHub's UI. Record the successful, exact-SHA verification as the
          # protected branch status before asking GitHub to merge.
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context=verify \
            -f description='CI passed for the exact synchronization commit' \
            -f target_url="${run_url}" \
            >/dev/null

          pr_json="$(
            gh api \
              "/repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&head=owenk-bonhoga%3A${SYNC_BRANCH}" \
              --jq 'if length == 1 then .[0] else empty end'
          )"
          [[ -n "${pr_json}" ]] || {
            echo "Expected exactly one open synchronization pull request." >&2
            exit 1
          }

          pr_number="$(jq -r '.number' <<<"${pr_json}")"
          pr_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          [[ "${pr_sha}" == "${HEAD_SHA}" ]] || {
            echo "The pull request changed after verification." >&2
            exit 1
          }

          merged="$(
            gh api \
              --method PUT \
              "/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/merge" \
              -f merge_method=merge \
              -f sha="${HEAD_SHA}" \
              --jq '.merged'
          )"
          [[ "${merged}" == "true" ]] || {
            echo "GitHub did not merge the verified synchronization pull request." >&2
            exit 1
          }

          # GITHUB_TOKEN merges do not emit another push workflow. Verify main
          # explicitly so production deployment remains gated by CI.
          gh workflow run ci.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main
